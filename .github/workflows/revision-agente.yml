name: Revisión por agente

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: revision-agente-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revision:
    name: Revisión del código por Claude
    runs-on: ubuntu-latest
    # Las PR de forks y las de Dependabot no reciben secretos: no se revisan.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && !github.event.pull_request.draft
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Comprobar el secreto
        id: clave
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Falta el secreto ANTHROPIC_API_KEY: la revisión por agente se omite."
          else
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.clave.outputs.disponible == 'true'
        with:
          fetch-depth: 1

      - name: Revisión del agente
        if: steps.clave.outputs.disponible == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Revisa esta pull request (repo ${{ github.repository }}, PR #${{ github.event.pull_request.number }}).
            Proyecto: API ASP.NET Core 8 en api/ (Clean Architecture) y web React 19 + Vite + TypeScript en web/.
            Busca, por este orden: errores de corrección, problemas de seguridad (inyección, secretos, autorización),
            regresiones, falta de tests para el comportamiento nuevo y problemas de rendimiento evidentes.
            Ignora el estilo y las preferencias personales. Responde en español, sin emojis, de forma concisa.
            Comenta en línea solo lo que merezca un cambio y termina con un resumen corto con el veredicto.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
